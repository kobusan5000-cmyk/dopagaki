name: ingest

# Cloud version of tools/publish.ps1: takes a project ZIP from the shared Google Drive folder,
# merges it into the repo, pushes, and runs the build. Started by the Apps Script in tools/cloud/
# (works while the PC is off). The final "RESULT: ..." step tells the Apps Script what to do with the ZIP.
#
# A ZIP that carries BASE_VERSION.txt (every starter ZIP does) is merged three ways with the current branch
# (ci/ingest-merge.sh): edits that do not overlap are combined, overlapping edits are held for review.
# A ZIP without that file replaces the project as a whole (the old behaviour).
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive file id of the ZIP"
        required: true
      file_name:
        description: "File name of the ZIP (for messages)"
        required: true
      test_url:
        description: "Testing only: download from this URL instead of Drive"
        required: false
      target_branch:
        description: "Testing only: merge into this branch instead of main (no build, no release, no Discord)"
        required: false
        default: "main"

permissions:
  contents: write
  actions: write

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  FILE_ID: ${{ inputs.file_id }}
  FILE_NAME: ${{ inputs.file_name }}
  TEST_URL: ${{ inputs.test_url }}
  TARGET: ${{ inputs.target_branch || 'main' }}
  DISCORD_WEBHOOK: ${{ (inputs.target_branch || 'main') == 'main' && secrets.DISCORD_WEBHOOK || '' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'main' }}
          fetch-depth: 0

      - name: Download the ZIP from Drive
        run: |
          if ! [[ "$FILE_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then echo "::error::bad file id"; exit 1; fi
          url="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          if [ -n "$TEST_URL" ]; then url="$TEST_URL"; fi
          curl -fsSL -o "$RUNNER_TEMP/in.zip" "$url"
          { unzip -tq "$RUNNER_TEMP/in.zip" > /dev/null || [ $? -eq 1 ]; } || { echo "::error::The download is not a valid ZIP (is the file shared by link?)"; exit 1; }
          ls -l "$RUNNER_TEMP/in.zip"

      - name: Compare with the current version
        id: an
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/in" && unzip -q "$RUNNER_TEMP/in.zip" -d "$RUNNER_TEMP/in" || [ $? -eq 1 ]  # exit 1 = only warnings (e.g. backslash paths)
          chmod -R u+rwX "$RUNNER_TEMP/in"
          mapfile -t projects < <(find "$RUNNER_TEMP/in" -name project.godot -not -path '*/.godot/*' -not -path '*/tools/*')
          if [ "${#projects[@]}" -eq 0 ]; then echo "::error::project.godot was not found inside the ZIP."; exit 1; fi
          if [ "${#projects[@]}" -gt 1 ]; then echo "::error::The ZIP contains more than one project.godot (nested projects?)."; exit 1; fi
          src=$(dirname "${projects[0]}")
          echo "$src" > "$RUNNER_TEMP/src.txt"

          # ---- merge mode (the ZIP says which version it started from) ----
          set +e
          bash ci/ingest-merge.sh "$src" "$RUNNER_TEMP/merge.out"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then echo "::error::ingest-merge.sh failed (exit $rc)"; exit 1; fi
          cat "$RUNNER_TEMP/merge.out"
          if [ "$rc" -eq 0 ]; then
            echo "mode=merge" >> "$GITHUB_OUTPUT"
            echo "base=$(grep '^base=' "$RUNNER_TEMP/merge.out" | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
            echo "result=$(grep '^result=' "$RUNNER_TEMP/merge.out" | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
            m=$(grep '^msg=' "$RUNNER_TEMP/merge.out" | cut -d= -f2- || true)
            if [ -n "$m" ]; then echo "msg=${FILE_NAME}: ${m}" >> "$GITHUB_OUTPUT"; fi
            git log --stat -1 --format=%s | tail -20
            exit 0
          fi

          # ---- legacy mode (no usable BASE_VERSION.txt): the ZIP replaces the project as a whole ----
          echo "mode=legacy" >> "$GITHUB_OUTPUT"
          # Line endings must not count as changes
          find "$src" -type f \( -name '*.gd' -o -name '*.tscn' -o -name '*.tres' -o -name '*.txt' -o -name '*.godot' -o -name '*.cfg' -o -name '*.gdshader' \) -exec sed -i 's/\r$//' {} +

          cat > "$RUNNER_TEMP/excl.txt" <<'EOF'
          /.git
          /.github
          /.godot
          /ci
          /tools
          /docs
          /README.md
          /.gitignore
          /export_presets.cfg
          /BASE_VERSION.txt
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/excl.txt"
          rsync -rcn --delete --itemize-changes --exclude-from="$RUNNER_TEMP/excl.txt" "$src/" ./ | grep -v '/$' > "$RUNNER_TEMP/diff.txt" || true
          cat "$RUNNER_TEMP/diff.txt"
          added=$(grep -c '^>f+++++++++' "$RUNNER_TEMP/diff.txt" || true)
          removed=$(grep -c '^\*deleting' "$RUNNER_TEMP/diff.txt" || true)
          total=$(wc -l < "$RUNNER_TEMP/diff.txt")
          suspicious=$(grep '^\*deleting' "$RUNNER_TEMP/diff.txt" | grep -vE '\.(import|uid)$' || true)
          echo "added=$added removed=$removed total=$total"
          if [ "$total" -eq 0 ]; then
            echo "result=nochange" >> "$GITHUB_OUTPUT"
          elif [ -n "$suspicious" ]; then
            n=$(echo "$suspicious" | wc -l)
            echo "result=held" >> "$GITHUB_OUTPUT"
            echo "msg=${FILE_NAME} は ${n} 個のファイルを削除する内容のため、公開を保留しました" >> "$GITHUB_OUTPUT"
          else
            echo "result=go" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge, push and build
        id: pub
        if: steps.an.outputs.result == 'go'
        run: |
          set -e
          src=$(cat "$RUNNER_TEMP/src.txt")
          top_block() { tr -d '\r' < "$1" | sed '1s/^\xEF\xBB\xBF//' | awk 'NF==0 { if (n) exit; else next } { n=1; print }'; }

          if [ "${{ steps.an.outputs.mode }}" = "legacy" ]; then
            rsync -a --checksum --delete --exclude-from="$RUNNER_TEMP/excl.txt" "$src/" ./
          fi

          # Per-version notes from the other developer: use the newest one as release notes when it is not on top of CHANGELOG.txt.
          prepend=""
          newest=$(ls "$src"/CHANGELOG_v*.txt 2>/dev/null | sed -E 's#.*/CHANGELOG_v(.*)\.txt#\1 &#' | sort -V | tail -1 | cut -d' ' -f2- || true)
          if [ -n "$newest" ]; then
            lines=$(tr -d '\r' < "$newest" | sed '1s/^\xEF\xBB\xBF//' | awk 'NF>0' | head -25)
            first=$(echo "$lines" | head -1)
            cur=""; [ -f "$src/CHANGELOG.txt" ] && cur=$(top_block "$src/CHANGELOG.txt")
            top=""; [ -f CHANGELOG.txt ] && top=$(top_block CHANGELOG.txt)
            if [ -n "$first" ] && [[ "$cur" != "$first"* ]] && [[ "$top" != "$first"* ]]; then prepend="$lines"; fi
          fi
          if [ -n "$prepend" ]; then
            { printf '%s\n\n' "$prepend"; cat CHANGELOG.txt 2>/dev/null || true; } > "$RUNNER_TEMP/cl.txt"
            mv "$RUNNER_TEMP/cl.txt" CHANGELOG.txt
          fi
          notes=$(top_block CHANGELOG.txt | head -8)
          { echo "notes<<EOF"; echo "$notes"; echo "EOF"; } >> "$GITHUB_OUTPUT"

          git add -A
          msg="Drive upload: ${FILE_NAME}"
          if [ "${{ steps.an.outputs.mode }}" = "merge" ]; then
            # ci/ingest-merge.sh left its merge as one commit on top: finish it
            git -c user.name=kouta -c user.email=kobusan5000-cmyk@users.noreply.github.com commit -q --amend -m "$msg" -m "Base: ${{ steps.an.outputs.base }}"
          else
            if git diff --cached --quiet; then
              echo "result=nochange" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git -c user.name=kouta -c user.email=kobusan5000-cmyk@users.noreply.github.com commit -q -m "$msg"
          fi
          git pull -q --rebase origin "$TARGET"
          git push -q origin "HEAD:$TARGET"
          sha=$(git rev-parse HEAD)

          if [ "$TARGET" != "main" ]; then
            echo "tag=test" >> "$GITHUB_OUTPUT"
            echo "result=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pushes made with GITHUB_TOKEN do not start other workflows, so start the build explicitly.
          gh workflow run build.yml --ref main
          run=""
          for i in $(seq 1 60); do
            run=$(gh run list --workflow build.yml --event workflow_dispatch --limit 10 --json databaseId,headSha -q "map(select(.headSha==\"$sha\"))[0].databaseId" || true)
            [ -n "$run" ] && [ "$run" != "null" ] && break
            sleep 3
          done
          if [ -z "$run" ] || [ "$run" = "null" ]; then echo "::error::GitHub did not start a build."; exit 1; fi
          if ! gh run watch "$run" --exit-status --interval 5 > /dev/null; then
            # The upload does not build: take it back off main, or every later merge would build on top of the broken version.
            echo "::error::The build failed (the game has errors). The upload is being reverted; testers keep the previous version."
            git pull -q --rebase origin main || true
            if git -c user.name=kouta -c user.email=kobusan5000-cmyk@users.noreply.github.com revert --no-edit "$sha" > /dev/null 2>&1; then
              git push -q origin HEAD:main || true
            else
              git revert --abort 2>/dev/null || true
              echo "::warning::Could not revert $sha automatically."
            fi
            exit 1
          fi
          tag=$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "result=published" >> "$GITHUB_OUTPUT"

      - name: Tell Discord (optional)
        if: always() && env.DISCORD_WEBHOOK != ''
        env:
          R: ${{ steps.pub.outputs.result || steps.an.outputs.result }}
          TAG: ${{ steps.pub.outputs.tag }}
          NOTES: ${{ steps.pub.outputs.notes }}
          HELD_MSG: ${{ steps.an.outputs.msg }}
          MODE: ${{ steps.an.outputs.mode }}
        run: |
          case "$R" in
            published) text="【公開】 ${TAG} をテスターに配信しました"$'\n'"${NOTES}" ;;
            held)      text="【要確認】 ${HELD_MSG}" ;;
            nochange)  text="" ;;
            *)         text="【要確認】 配信に失敗しました: ${FILE_NAME}" ;;
          esac
          [ -z "$text" ] && exit 0
          jq -n --arg c "${text:0:1900}" '{username:"DOPAGAKI", content:$c}' | curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK" || true

      # The Apps Script reads which of these steps ran (conclusion "success") to decide where to move the ZIP.
      - name: "RESULT: published"
        if: steps.pub.outputs.result == 'published'
        run: echo "published ${{ steps.pub.outputs.tag }}"
      - name: "RESULT: nochange"
        if: steps.an.outputs.result == 'nochange' || steps.pub.outputs.result == 'nochange'
        run: echo "nochange"
      - name: "RESULT: held"
        if: steps.an.outputs.result == 'held'
        run: echo "held"
      - name: "RESULT: failed"
        if: failure()
        run: echo "failed"
